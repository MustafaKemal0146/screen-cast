<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>screencast — Live Stream</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/overlays.css" />
</head>
<body>
  <main id="stage" aria-label="screencast live stream player">
    <!-- 1. Video stage -->
    <video id="player-video" autoplay playsinline muted></video>

    <!-- 2. Remote control cursor overlay -->
    <div id="cursor-overlay" aria-hidden="true"></div>

    <!-- 3. Top bar -->
    <header id="top-bar">
      <div class="pill frosted" id="device-pill">
        <span id="device-name">screencast</span>
      </div>
      <div class="badges-right">
        <div class="pill frosted" id="live-badge">
          <span class="live-dot" id="live-dot"></span>
          <span id="live-text">CONNECTING</span>
        </div>
        <div class="pill frosted" id="quality-badge">auto</div>
        <div class="pill frosted" id="latency-badge">-- ms</div>
      </div>
    </header>

    <!-- State overlay -->
    <section id="state-overlay" class="visible solid" role="status" aria-live="polite">
      <div class="spinner" id="state-spinner"></div>
      <h1 class="state-title" id="state-title">Connecting...</h1>
      <p class="state-desc" id="state-desc">Preparing desktop stream.</p>
      <button class="primary-action" id="state-action" hidden>Reconnect</button>
    </section>

    <!-- 4. Bottom control bar -->
    <nav id="bottom-bar" class="frosted" aria-label="Player controls">
      <button class="ctrl-btn" id="btn-play" title="Play / Pause (Space)" aria-label="Play or pause">⏸</button>
      <button class="ctrl-btn" id="btn-mute" title="Mute / Unmute (M)" aria-label="Mute or unmute">🔇</button>
      <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button>
      <button class="ctrl-btn" id="btn-control" title="Remote control (C)" aria-label="Remote control mode">🖱 Remote</button>
      <button class="ctrl-btn" id="btn-more" title="Menu" aria-label="More options">⋯</button>
    </nav>

    <!-- Secondary menu -->
    <div id="more-menu" role="dialog" aria-label="Stream options">
      <div class="menu-row">
        <label id="lbl-tv-mode" for="tv-mode-toggle">TV Mode (large UI)</label>
        <button class="ctrl-btn" id="tv-mode-toggle">Off</button>
      </div>
      <div class="menu-row">
        <label id="lbl-language" for="lang-toggle">Language</label>
        <button class="ctrl-btn" id="lang-toggle">EN</button>
      </div>
      <div class="menu-row">
        <label id="lbl-active-quality" for="quality-info">Active Quality</label>
        <span id="quality-info" class="menu-select" style="display:flex;align-items:center;">auto</span>
      </div>
      <div class="menu-row">
        <span id="lbl-shortcuts">Shortcuts</span>
        <span id="shortcuts-hint" style="color:var(--text-secondary);font-size:0.85em;">F · M · C · Space</span>
      </div>
    </div>

    <!-- 5. Toast -->
    <div id="toast" class="frosted" role="status"></div>
  </main>

  <script src="/hls.min.js"></script>
  <script src="/i18n_tr.js"></script>
  <script src="/i18n.js"></script>
  <script src="/mse.js"></script>
  <script src="/controls.js"></script>
  <script src="/app.js"></script>
</body>
</html>
