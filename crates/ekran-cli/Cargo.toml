[package]
name = "ekran-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ekran-core = { workspace = true }
ekran-capture = { workspace = true }
ekran-encode = { workspace = true }
ekran-audio = { workspace = true }
ekran-transport = { workspace = true }
ekran-sinks = { workspace = true }
ekran-ui = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"

[[bin]]
name = "ekran"
path = "src/main.rs"
