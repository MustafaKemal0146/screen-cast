[workspace]
resolver = "2"
members = [
  "crates/screencast-core",
  "crates/screencast-capture",
  "crates/screencast-encode",
  "crates/screencast-audio",
  "crates/screencast-transport",
  "crates/screencast-sinks",
  "crates/screencast-ui",
  "crates/screencast-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
screencast-core = { path = "crates/screencast-core" }
screencast-capture = { path = "crates/screencast-capture" }
screencast-encode = { path = "crates/screencast-encode" }
screencast-audio = { path = "crates/screencast-audio" }
screencast-transport = { path = "crates/screencast-transport" }
screencast-sinks = { path = "crates/screencast-sinks" }
screencast-ui = { path = "crates/screencast-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
base64 = "0.22"
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ratatui = "0.29"
crossterm = "0.28"
zbus = { version = "4", default-features = false, features = ["tokio"] }
