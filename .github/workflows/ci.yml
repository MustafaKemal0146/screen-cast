name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime tools for tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  package-musl-deb:
    runs-on: ubuntu-24.04
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install musl & dpkg tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static musl binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p screencast-cli
      - name: Build .deb package
        run: bash packaging/deb/build-deb.sh target/x86_64-unknown-linux-musl/release/screencast
      - uses: actions/upload-artifact@v4
        with:
          name: screencast-linux-amd64
          path: dist/
